# Cloudflare -> VPS origin reverse proxy for hakimrazak.com
#
# Install as /etc/nginx/conf.d/hakimrazak.com.conf
# TLS cert: Cloudflare Origin CA (Full (strict) mode)
#   /etc/ssl/cloudflare/hakimrazak.com.pem
#   /etc/ssl/cloudflare/hakimrazak.com.key
# Port 80 stays reachable so Cloudflare and ACME can validate.
# Target runtime: nginx 1.24 (Ubuntu 24.04), which predates the `http2 on;`
# directive (nginx >= 1.25.1) -- hence the `listen ... ssl http2` form below.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Trust Cloudflare edge IPs so Next.js sees the real client IP.
# Refresh with: curl -s https://www.cloudflare.com/ips-v4 \
#   | sed 's/^/set_real_ip_from /;s/$/;/' > /etc/nginx/cloudflare-ips.conf
include /etc/nginx/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name hakimrazak.com www.hakimrazak.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hakimrazak.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hakimrazak.com;

    ssl_certificate     /etc/ssl/cloudflare/hakimrazak.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/hakimrazak.com.key;

    return 301 https://hakimrazak.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hakimrazak.com;

    ssl_certificate     /etc/ssl/cloudflare/hakimrazak.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/hakimrazak.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Docker publishes the app on 127.0.0.1:3000
    set $upstream_app http://127.0.0.1:3000;

    client_max_body_size 5m;

    location /_next/static/ {
        proxy_pass $upstream_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass $upstream_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
